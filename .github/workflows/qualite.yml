# Contrôle qualité automatique : s'exécute à chaque push (y compris ceux de Lovable) et à chaque pull request.
# Un ✗ rouge sur GitHub signifie qu'une modification a cassé l'un des contrôles ci-dessous.
name: Qualité

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # bun.lock (géré par Lovable) épingle une partie des paquets sur le cache npm privé de Lovable,
      # inaccessible depuis GitHub (403). On le met de côté DANS LA CI SEULEMENT et bun résout les mêmes
      # plages de versions (package.json, overrides, bunfig.toml) sur le registre public.
      # npm n'est pas utilisé : il plante sur le bloc « overrides » (bug « reading 'edgesOut' »).
      - name: Dépendances
        run: |
          mv bun.lock bun.lock.lovable
          bun install --no-save

      - name: Typage TypeScript
        run: bunx tsc --noEmit -p .

      - name: Lint
        run: bun run lint

      - name: Tests (noyau métier + accès)
        run: bun run test

      - name: Sécurité RLS (migrations rejouées sur PostgreSQL en mémoire)
        run: node supabase/tests/rls_test.mjs

      - name: Build de production
        run: bun run build
